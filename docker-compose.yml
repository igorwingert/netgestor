# Banco de dados do NetGestor (PostgreSQL 16).
# Subir:  docker compose up -d
# Parar:  docker compose down      (os dados ficam no volume)
# Zerar:  docker compose down -v   (apaga o volume; o Flyway recria tudo na próxima subida)
services:
  postgres:
    image: postgres:16-alpine
    container_name: netgestor-db
    environment:
      POSTGRES_DB: netgestor
      POSTGRES_USER: netgestor
      POSTGRES_PASSWORD: netgestor
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - netgestor-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netgestor -d netgestor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  netgestor-data:
