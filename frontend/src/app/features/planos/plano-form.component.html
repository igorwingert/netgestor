<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0"><i class="bi bi-speedometer2"></i> {{ planoId() ? 'Editar plano' : 'Novo plano' }}</h1>
  <a class="btn btn-outline-secondary" routerLink="/planos"><i class="bi bi-arrow-left"></i> Voltar</a>
</div>

<form class="card card-body" [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="nome">Nome</label>
      <input id="nome" class="form-control" formControlName="nome" [class.is-invalid]="erro('nome')" />
      @if (erro('nome'); as msg) { <div class="invalid-feedback">{{ msg }}</div> }
    </div>
    <div class="col-md-3">
      <label class="form-label" for="tecnologia">Tecnologia</label>
      <select id="tecnologia" class="form-select" formControlName="tecnologia">
        <option value="FIBRA">Fibra</option>
        <option value="RADIO">Rádio</option>
      </select>
    </div>
    <div class="col-md-3 d-flex align-items-end">
      <div class="form-check form-switch mb-2">
        <input id="ativo" class="form-check-input" type="checkbox" formControlName="ativo" />
        <label class="form-check-label" for="ativo">À venda (ativo)</label>
      </div>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="downloadMbps">Download (Mbps)</label>
      <input id="downloadMbps" type="number" class="form-control" formControlName="downloadMbps" [class.is-invalid]="erro('downloadMbps')" />
      @if (erro('downloadMbps'); as msg) { <div class="invalid-feedback">{{ msg }}</div> }
    </div>
    <div class="col-md-4">
      <label class="form-label" for="uploadMbps">Upload (Mbps)</label>
      <input id="uploadMbps" type="number" class="form-control" formControlName="uploadMbps" [class.is-invalid]="erro('uploadMbps')" />
      @if (erro('uploadMbps'); as msg) { <div class="invalid-feedback">{{ msg }}</div> }
    </div>
    <div class="col-md-4">
      <label class="form-label" for="valorMensal">Mensalidade (R$)</label>
      <input id="valorMensal" type="number" step="0.01" class="form-control" formControlName="valorMensal" [class.is-invalid]="erro('valorMensal')" />
      @if (erro('valorMensal'); as msg) { <div class="invalid-feedback">{{ msg }}</div> }
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn btn-primary" [disabled]="salvando()">
      <i class="bi bi-check-lg"></i> {{ salvando() ? 'Salvando...' : 'Salvar' }}
    </button>
  </div>
</form>
