<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0"><i class="bi bi-headset"></i> Abrir chamado</h1>
  <a class="btn btn-outline-secondary" routerLink="/chamados"><i class="bi bi-arrow-left"></i> Voltar</a>
</div>

<form class="card card-body" [formGroup]="form" (ngSubmit)="abrir()" novalidate>
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="contratoId">Contrato</label>
      <select id="contratoId" class="form-select" formControlName="contratoId" [class.is-invalid]="erro('contratoId')">
        <option [ngValue]="null">Selecione...</option>
        @for (contrato of contratos(); track contrato.id) {
          <option [ngValue]="contrato.id">{{ contrato.numero }} · {{ contrato.clienteNome }}</option>
        }
      </select>
      @if (erro('contratoId'); as msg) { <div class="invalid-feedback">{{ msg }}</div> }
    </div>
    <div class="col-md-3">
      <label class="form-label" for="tipo">Tipo</label>
      <select id="tipo" class="form-select" formControlName="tipo">
        <option value="SEM_CONEXAO">Sem conexão</option>
        <option value="LENTIDAO">Lentidão</option>
        <option value="FINANCEIRO">Financeiro</option>
        <option value="OUTRO">Outro</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label" for="prioridade">Prioridade</label>
      <select id="prioridade" class="form-select" formControlName="prioridade">
        <option value="BAIXA">Baixa</option>
        <option value="MEDIA">Média</option>
        <option value="ALTA">Alta</option>
        <option value="CRITICA">Crítica</option>
      </select>
    </div>
    <div class="col-12">
      <label class="form-label" for="descricao">Descrição</label>
      <textarea id="descricao" rows="4" class="form-control" formControlName="descricao"
                placeholder="O que o cliente relatou?" [class.is-invalid]="erro('descricao')"></textarea>
      @if (erro('descricao'); as msg) { <div class="invalid-feedback">{{ msg }}</div> }
    </div>
  </div>
  <div class="mt-3">
    <button type="submit" class="btn btn-primary" [disabled]="salvando()">
      <i class="bi bi-send"></i> {{ salvando() ? 'Abrindo...' : 'Abrir chamado' }}
    </button>
  </div>
</form>
