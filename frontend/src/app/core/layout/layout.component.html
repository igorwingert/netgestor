<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/"><i class="bi bi-router"></i> NetGestor</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal"
            aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu-principal">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            <i class="bi bi-house"></i> Início
          </a>
        </li>
        @for (item of menu(); track item.rota) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="item.rota" routerLinkActive="active">
              <i class="bi" [class]="'bi ' + item.icone"></i> {{ item.rotulo }}
            </a>
          </li>
        }
      </ul>

      @if (auth.usuario(); as usuario) {
        <span class="navbar-text text-white me-3">
          <i class="bi bi-person-circle"></i> {{ usuario.nome }}
          <span class="badge text-bg-light ms-1">{{ usuario.perfil }}</span>
        </span>
        <button class="btn btn-outline-light btn-sm" type="button" (click)="sair()">
          <i class="bi bi-box-arrow-right"></i> Sair
        </button>
      }
    </div>
  </div>
</nav>

<main class="container py-4">
  <router-outlet />
</main>
