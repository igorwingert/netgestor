# configuracao da API NetGestor.
# cada valor sensivel vem de uma variavel de ambiente; o valor depois dos ":"
# e o padrao usado em desenvolvimento (bate com o docker-compose.yml).
spring:
  application:
    name: netgestor

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/netgestor}
    username: ${DB_USER:netgestor}
    password: ${DB_PASSWORD:netgestor}

  jpa:
    hibernate:
      # o schema e responsabilidade do Flyway. o Hibernate so confere se as
      # entidades batem com as tabelas e falha na subida se algo divergir.
      ddl-auto: validate
    # desliga o "Open Session in View": as consultas ao banco ficam dentro
    # dos services (@Transactional), e nao durante a escrita da resposta HTTP.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# configuracoes proprias do projeto (seguranca jwt e cors)
netgestor:
  jwt:
    # chave HMAC-SHA256: precisa ter pelo menos 32 caracteres.
    secret: ${JWT_SECRET:netgestor-chave-de-desenvolvimento-troque-em-producao-2026}
    # validade do token em milissegundos (padrao: 2 horas)
    expiration: ${JWT_EXPIRATION:7200000}
  cors:
    allowed-origins: http://localhost:4200
